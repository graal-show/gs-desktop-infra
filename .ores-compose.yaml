schema_version: ores.compose.v1
project: graal-show-desktop
allow_lazy_start: false
source:
  repository: https://github.com/graal-show/gs-desktop-daemon.git
  commit: 12f610fe25ae9d5f64626a45975ac1aa6ac1a490
  checkout_dir: tmp/dev/gs-desktop-daemon
services:
  daemon:
    runtime: host
    build:
      - ["cargo", "build", "--release", "--locked"]
    command: ["./target/release/gs-desktop-daemon"]
    environment:
      GS_DESKTOP_ADDR: "127.0.0.1:8764"
    healthcheck:
      command: ["curl", "--fail", "--silent", "http://127.0.0.1:8764/healthz"]
      interval_ms: 250
      timeout_ms: 1000
      retries: 20
