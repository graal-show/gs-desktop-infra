schema_version: ores.compose.v1
project: graal-show-desktop
allow_lazy_start: false
source:
  repository: https://github.com/graal-show/gs-desktop-daemon.git
  commit: 8bc6379cf564c243c8d867359cc6ffa572c443e9
  checkout_dir: tmp/dev/gs-desktop-daemon
services:
  daemon:
    runtime: host
    build:
      - ["cargo", "build", "--release"]
    command: ["cargo", "run", "--release"]
    healthcheck:
      command: ["curl", "--fail", "--silent", "http://127.0.0.1:8764/healthz"]
      interval_ms: 250
      timeout_ms: 1000
      retries: 20
  tunnel:
    runtime: host
    command: ["cloudflared", "tunnel", "run", "--token-file", "${GS_CF_TUNNEL_TOKEN_FILE}"]
    depends_on: [daemon]
